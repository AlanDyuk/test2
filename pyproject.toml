[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "albion-market-strategist"
version = "0.1.0"
description = "Automated price arbitrage scanner for Albion Online"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "apscheduler>=3.10.0",
    "psutil>=5.9.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
albion = "src.ui.cli.main:main"
